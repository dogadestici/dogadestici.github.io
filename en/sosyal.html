<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social - Doğa Destici</title>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/media.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
      integrity="sha512-1cK78a1o+ht2JcaW6g8OXYwqpev9+6GqOkz9xmBN9iUUhIndKtxwILGWYOSibOKjLsEdjyjZvYDq/cZwNeak0w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .academic-info-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 120px 20px 80px 20px;
      }
      .academic-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 30px;
        margin-top: 50px;
        margin-bottom: 20px;
      }
      .academic-card {
        min-width: 0;
        max-width: none;
        display: block;
        position: relative;
        text-decoration: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .academic-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      }
      .card-bg-img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        display: block;
      }
      .card-body {
        padding: 25px;
        background: var(--gray-color);
        border: 2px solid var(--primary-accent);
        border-top: none;
      }
      .card-body h3 {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 12px;
        color: var(--primary-accent);
      }
      .card-body p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--supportive-text-color);
      }
      body.dark-mode .card-body {
        background: #1a1a1a !important;
        border-color: #ffffff !important;
      }
      body.dark-mode .card-body h3,
      body.dark-mode .card-body p {
        color: #ffffff !important;
      }
    </style>
  </head>

  <body>
    <header id="header" class="header">
      <div class="container container-lg">
        <div class="header-nav">
          <a href="index.html" class="logo">DOĞA DESTİCİ</a>
          <button id="nav-btn" class="nav-btn" aria-label="Toggle Menu">
            <img id="nav-btn-img" src="../img/icons/open.svg" alt="Menu" />
          </button>
          <nav id="nav" class="nav">
            <ul class="nav-list">
              <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
              <li class="nav-item"><a href="akademik.html" class="nav-link">Academic</a></li>
              <li class="nav-item"><a href="sosyal.html" class="nav-link active">Social</a></li>
              <li class="nav-item"><a href="index.html#contact" class="nav-link">Contact</a></li>
              <li class="nav-item">
                <a href="../sosyal.html" class="nav-link">🇹🇷TR</a>
              </li>
              <li class="nav-item">
                <button id="darkModeToggle" class="dark-toggle-btn">◑ MODE</button>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <div class="academic-info-container">
      <a href="index.html" class="back-btn">← Back to Home</a>

      <div class="academic-row social-overview-row">
        <a href="topluluklar.html" class="academic-card">
          <img src="../img/works/sosyal.jpeg" alt="My Communities" class="card-bg-img" />
          <div class="card-body">
            <h3>My Communities</h3>
            <p>My social work through Ankarock, UNIROCK, ESN, and Spotify.</p>
          </div>
        </a>

        <a href="gezi.html" class="academic-card">
          <img src="../img/works/gezi.jpeg" alt="Travel" class="card-bg-img" />
          <div class="card-body">
            <h3>Travel</h3>
            <p>My personal routes, travel notes, and Erasmus+ projects.</p>
          </div>
        </a>

        <a href="blog-sosyal.html" class="academic-card">
          <img src="../img/works/sosyal-blog.jpg" alt="Social Blog" class="card-bg-img" />
          <div class="card-body">
            <h3>Social Blog</h3>
            <p>Notes on music, events, travel, and everyday life.</p>
          </div>
        </a>
      </div>


    </div>


    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"
      integrity="sha512-A7AYk1fGKX6S2SsHywmPkrnzTZHrgiVT7GcQkLGDe2ev0aWb8zejytzS8wjo7PGEXKqJOrjQ4oORtnimIRZBtw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="../js/site.js"></script>
  </body>
</html>
